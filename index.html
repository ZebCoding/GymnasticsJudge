<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Camera Fullscreen Fit</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: black;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  #video {
    object-fit: contain; /* keeps aspect ratio, no cropping */
    width: 100%;
    height: 100%;
    max-width: 100%;
    max-height: 100%;
  }
  
</style>
</head>
<body>
<video id="video" autoplay playsinline></video>
<div id="fakeButton"></div>
<script src="script.js"></script>
</body>
</html>
