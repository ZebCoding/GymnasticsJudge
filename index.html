<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fullscreen Camera Fit</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      background: black;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #video {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain; /* Keep aspect ratio, fit entirely in screen */
    }
  </style>
</head>
<body>
  <video id="video" autoplay playsinline></video>
  <script src="script.js"></script>
</body>
</html>
