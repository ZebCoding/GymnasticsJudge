<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salute Detection</title>

<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: black;
    overflow: hidden;
  }

  #video {
    position: absolute;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  #overlay {
    position: absolute;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }
</style>
</head>

<body>
<video id="video" autoplay playsinline></video>
<canvas id="overlay"></canvas>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('overlay');
const ctx = canvas.getContext('2d');

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// Pose setup
const pose = new Pose.Pose({
  locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
});

pose.setOptions({
  modelComplexity: 1,
  smoothLandmarks: true,
  minDetectionConfidence: 0.5,
  minTrackingConfidence: 0.5
});

pose.onResults(onResults);

// Camera setup
const camera = new Camera(video, {
  onFrame: async () => {
    await pose.send({ image: video });
  },
  width: 1280,
  height: 720
});

camera.start();

// Resize fix
window.addEventListener('resize', () => {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});

function onResults(results) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (!results.poseLandmarks) return;

  // Draw ONLY skeleton (no background image)
  drawConnectors(ctx, results.poseLandmarks, POSE_CONNECTIONS, {
    color: '#00FF00',
    lineWidth: 4
  });

  drawLandmarks(ctx, results.poseLandmarks, {
    color: '#FF0000',
    lineWidth: 2
  });

  const lm = results.poseLandmarks;

  const leftWrist = lm[15];
  const rightWrist = lm[16];
  const leftShoulder = lm[11];
  const rightShoulder = lm[12];
  const leftHip = lm[23];
  const rightHip = lm[24];

  // Straight body
  const torsoStraight =
    Math.abs((leftShoulder.x + rightShoulder.x)/2 -
             (leftHip.x + rightHip.x)/2) < 0.05;

  // Arm up
  const leftArmUp =
    leftWrist.y < leftShoulder.y &&
    Math.abs(leftWrist.x - leftShoulder.x) < 0.1;

  const rightArmUp =
    rightWrist.y < rightShoulder.y &&
    Math.abs(rightWrist.x - rightShoulder.x) < 0.1;

  if (torsoStraight && (leftArmUp || rightArmUp)) {
    console.log("SALUTE DETECTED");
  }
}
</script>
</body>
</html>
