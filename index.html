<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gymnastics Salute Detection</title>
<style>
    html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    background: black;
    display: flex;
    justify-content: center; /* center horizontally */
    align-items: center;     /* center vertically */
    overflow: hidden;
  }

  #video {
    width: 100%;
    height: 100%;
    max-width: 100%;
    max-height: 100%;
    object-fit: contain; /* keep aspect ratio, no cropping */
  }

  #overlay {
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 2rem;
    font-weight: bold;
    text-shadow: 0 0 10px black;
  }
</style>
</head>
<body>
<video id="video" autoplay playsinline></video>
<div id="overlay">Waiting for Salute...</div>
<script type="module" src="script.js"></script>
</body>
</html>
